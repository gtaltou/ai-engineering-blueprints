name: CI Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Strict Mypy Type Checker
        run: |
          mypy src tests
          mypy blueprints/01_structured_web_ingestion/pipeline.py
          mypy blueprints/02_hybrid_rag_reranking/pipeline.py
          mypy blueprints/03_agentic_tool_use_and_reflection/pipeline.py

      - name: Run Unit Tests with Coverage
        run: pytest --cov=blueprint_core --cov-report=term-missing
