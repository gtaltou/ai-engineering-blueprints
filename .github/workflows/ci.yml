name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Typecheck & Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter & Formatter check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Strict Static Type Checking (Mypy)
        run: |
          mypy src tests
          mypy blueprints/01_structured_web_ingestion/pipeline.py
          mypy blueprints/02_hybrid_rag_reranking/pipeline.py

      - name: Run Deterministic Unit Test Suite (Pytest)
        run: |
          pytest -v --cov=src --cov-report=term-missing
